- id: 1
  title: What is Sacred Harp/shape-note singing?
  content: Sacred Harp is a uniquely American tradition of communal, four-part singing with roots going back to the eighteenth and nineteenth centuries. We sing <em>a cappella</em> tunes composed from distinctive “shape notes,” where the shapes signify specific notes of a scale and teach singers how to read music. One of the most important and popular shape-note tunebooks is the <em>Sacred Harp</em> (originally printed in 1844), which itself refers to the unaccompanied human voice. Shape-note singing is inclusive, non-denominational, self-led, and social, and it continues to bring together people of all backgrounds, beliefs, and identities.
- id: 2
  title: Do I need to be able to read music or have prior experience to join?
  content: Absolutely not! Sacred Harp singings are open and welcome to all, regardless of experience. Singers at any given session will have a wide variety of experience and skill levels. The best way to learn the music is to come experience a singing!
- id: 3
  title: What does it sound like?
  content: Sacred Harp singing is unlike most four-part choral singing that many people are familiar with from church or school choirs. Steeped in the sonorities of Southern folk music, the sound has a raw force that has been variously described as rousing, raucous, relentless, primal, and transcendent. No one voice part is more important than another, and the complex interweaving of parts creates a harmonic whole that can be fully appreciated only through direct experience. The best way to hear this music is to join us at a singing! You can also watch recordings from the All-California Convention (<a href="https://www.youtube.com/live/ZGQd6kt-wBo?si=emr3yyZpq8ppVjCc" target="_blank">Part 1</a> and <a href="https://www.youtube.com/live/VLXRPQ5rcWM?si=Fj1cn5B35NAA8q4x" target="_blank">Part 2</a>) or see traditional singings in the documentary film <a href="https://youtu.be/bjtGexg2eqk?si=YxTLVSqPhMFWAK-O" target="_blank"><em>Awake, My Soul</em></a> (2008).
- id: 4
  title: I’m new; what can I expect at my first singing?
  content: First of all, welcome! There are no rehearsals, requirements, commitments, or rigid rules for Sacred Harp singings; you can observe and/or participate at whatever level you feel comfortable. You should also feel free to ask any singer for help finding a section you might want to sit in. Most local singings have “loaner books” available, which you can borrow for the duration of the singing. This <a href="/docs/grayson-beginners-guide.pdf" target="_blank">Beginner’s Guide</a> (PDF, 57 KB) by Lisa Grayson also has more details and tips for any curious singers.
- id: 5
  title: Where can I find more resources and helpful material?
  content: View our Resources & Links page for more information on the history and practice of shape-note singing, as well as tips for singers and newcomers.
